services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /cache/huggingface
    volumes:
      - model_cache:/cache/huggingface
    depends_on:
      - qdrant
    restart: on-failure
volumes:
  qdrant_data:
  model_cache:
