<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Sin viewport-fit=cover ni setInsets: el mapa es una tarjeta dentro de Compose (pasarInsets = false). FE-3.4. -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mapa de lugares</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --fondo: #0A0E1A;
    --violeta: #7C5CFF;
    --violeta-claro: #C4B5FD;
    --pin: #FF4D7D;
  }
  html, body, #map { height: 100%; margin: 0; background: var(--fondo); }
  body { font-family: system-ui, sans-serif; overflow: hidden; }
  .leaflet-container { background: var(--fondo); }
  .icono-vacio { background: none; border: none; }

  /* Otros lugares: punto violeta con el nombre debajo. */
  .lugar { width: 18px; height: 18px; border-radius: 50%; background: var(--violeta); border: 2px solid #fff; box-sizing: border-box; }
  .lugar.tocable { width: 24px; height: 24px; }
  .leaflet-tooltip.nombre { background: #141a2e; color: #fff; border: 1px solid #2a3358; box-shadow: none; font-size: 12px; padding: 2px 6px; }
  .leaflet-tooltip.nombre:before { display: none; }

  /* Punto de llegada del lugar que se edita: alfiler rosa arrastrable, grande para dedos. */
  .pin { width: 40px; height: 40px; }
  .pin svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<!-- MapaBase.iniciar (5.9) mide #top / #dock y cablea #btn-back: esta página no los usa (como recoleccion_mapa). -->
<div id="top" hidden></div><div id="dock" hidden></div><button id="btn-back" hidden aria-hidden="true" tabindex="-1"></button>

<div id="map" role="application" aria-label="Mapa de lugares"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="mapa_base.js"></script>
<script src="lugar_mapa.js"></script>
</body>
</html>
