<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Editor de mapa y alertas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--surf:#111827;--glass:rgba(17,24,39,.88);--acc:#6366f1;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--info:#3b82f6;
--tx:#f1f5f9;--tx2:#94a3b8;--bd:rgba(99,102,241,.45);--r:14px;--font:'Inter',-apple-system,sans-serif;
/* Los fija el JS: insets del sistema (los manda Kotlin) y alto real de cabecera y dock */
--sat:0px;--sab:0px;--toph:150px;--dockh:90px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font)}
#map{position:absolute;inset:0;z-index:1}
button,select{font-family:inherit;color:inherit}
button{cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Cabecera ── */
.top{position:fixed;top:0;left:0;right:0;z-index:500;padding:calc(var(--sat) + 8px) 12px 8px;pointer-events:none}
.top::before{content:'';position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 100px);background:linear-gradient(rgba(10,14,26,.96) 60%,transparent);z-index:-1;pointer-events:none}
.head{display:flex;align-items:flex-start;gap:8px}
.back{width:44px;min-width:44px;height:48px;margin-left:-8px;background:none;border:0;color:var(--acc);pointer-events:auto}
.back .ic{width:28px;height:28px}
.ttl{flex:1;min-width:0;padding-top:3px}
.ttl h1{font-size:1.05rem;font-weight:600;line-height:1.2}
.ttl h1 b{color:var(--acc);font-weight:600}
.ttl p{font-size:.74rem;color:var(--tx2);font-weight:400;margin-top:3px;line-height:1.3}
.chip{flex:none;max-width:46%;display:flex;align-items:center;gap:6px;border:1.5px solid var(--warn);color:var(--warn);background:var(--glass);
  border-radius:18px;padding:5px 10px;min-height:34px;margin-top:4px;font-size:.72rem;font-weight:500;line-height:1.15;pointer-events:auto;backdrop-filter:blur(8px)}
.chip .ic{width:16px;height:16px}
.chip.ok{border-color:var(--ok);color:var(--ok)}

/* ── Capas y filtros ── */
.filters{display:flex;gap:8px;margin-top:10px;align-items:flex-start;pointer-events:none}
.layers,.flt{background:var(--glass);border:1.5px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(8px);pointer-events:auto}
.layers{flex:0 0 108px;overflow:hidden}
.layers summary{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 8px;list-style:none;font-size:.78rem;font-weight:500;cursor:pointer}
.layers summary::-webkit-details-marker{display:none}
.layers summary .ic:first-child{color:var(--acc);width:18px;height:18px}
.layers summary .chev{margin-left:auto;width:16px;height:16px;color:var(--tx2);transition:transform .15s}
.layers[open] summary .chev{transform:rotate(180deg)}
.layers label{display:flex;gap:7px;align-items:center;min-height:32px;padding:0 8px;font-size:.74rem;line-height:1.15}
.layers input{width:17px;height:17px;flex:none;accent-color:var(--acc)}
.flt{position:relative;flex:1;min-width:0;min-height:58px;padding:8px 8px 6px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.flt .lbl{display:flex;align-items:center;gap:5px;font-size:.7rem;font-weight:500;color:var(--tx2);white-space:nowrap;overflow:hidden}
.flt .lbl .ic{width:14px;height:14px;color:var(--acc)}
.flt .val{display:flex;align-items:center;justify-content:space-between;gap:2px;font-size:.82rem;font-weight:500;white-space:nowrap}
.flt .val span{overflow:hidden;text-overflow:ellipsis}
.flt .val .ic{width:15px;height:15px;color:var(--tx2)}
.flt.on{border-color:var(--acc)}.flt.on .val{color:#a5b4fc}
/* el select real cubre toda la caja (invisible) para que cualquier toque abra el selector nativo */
.flt select{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px}
.flt select option{background:#111827;color:#f1f5f9}
@media (max-width:400px){.flt .lbl .ic{display:none}}

/* ── Botones laterales y "Nueva alerta" ── */
.side{position:fixed;right:12px;top:calc(var(--toph) + 8px);z-index:450;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.fab{min-height:44px;justify-content:flex-start;background:var(--glass);border:1.5px solid var(--bd);border-radius:var(--r);padding:0 14px;font-size:.84rem;font-weight:500;backdrop-filter:blur(8px)}
.fab .ic{width:19px;height:19px;color:var(--acc)}
#btn-new{position:fixed;right:12px;z-index:450;bottom:calc(var(--dockh) + 12px);background:var(--acc);border:0;border-radius:99px;
  font-weight:600;font-size:.95rem;padding:0 22px;min-height:52px;color:#fff;box-shadow:0 6px 24px rgba(99,102,241,.5)}
#btn-new.cancel{background:var(--surf);border:1.5px solid var(--bad);color:var(--bad);box-shadow:none}

/* ── Dock: tarjeta, aviso de mover y barra inferior ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:500;padding:10px 12px calc(12px + var(--sab));
  background:linear-gradient(transparent,rgba(10,14,26,.95) 30px);pointer-events:none}
.dock>*{pointer-events:auto}
.card{background:var(--glass);backdrop-filter:blur(10px);border:1.5px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:12px;position:relative}
.c-head{display:flex;gap:12px;align-items:flex-start;padding-right:30px}
.c-ico{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid;display:grid;place-items:center;background:rgba(10,14,26,.9);font-size:20px}
.c-ttl{min-width:0}
.card h2{font-size:1rem;font-weight:600;display:inline;vertical-align:middle}
.badge{font-size:.7rem;font-weight:500;border:1px solid;border-radius:99px;padding:1px 9px;margin-left:8px;vertical-align:middle;background:color-mix(in srgb,currentColor 14%,transparent)}
.card .msg{color:var(--tx2);font-size:.85rem;margin-top:4px;line-height:1.35}
.card .x{position:absolute;top:2px;right:2px;width:44px;height:44px;background:none;border:0;color:var(--tx2)}
.c-foot{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.meta{flex:1;min-width:0;font-size:.78rem;color:var(--tx2);display:flex;flex-direction:column;gap:8px}
.meta div{display:flex;gap:8px;align-items:center;line-height:1.3}
.meta .ic{width:17px;height:17px;color:var(--acc)}
.acts{display:flex;gap:8px}
.acts button{flex:1;background:var(--surf);border:1.5px solid var(--info);color:var(--info);border-radius:10px;font-size:.85rem;font-weight:500}
.acts .del{border-color:var(--bad);color:var(--bad)}
.card .acts{flex:none;gap:6px}
.card .acts button{flex:none;flex-direction:column;gap:4px;width:56px;min-height:56px;padding:4px 0;font-size:.7rem;background:rgba(10,14,26,.6)}
.card .acts #a-mover{border-color:var(--acc);color:#a5b4fc}
.move{background:var(--glass);border:1.5px solid var(--acc);border-radius:var(--r);padding:10px;margin-bottom:12px}
.move p{font-size:.88rem;margin-bottom:8px}
.move .acts button{border-color:var(--acc);color:var(--tx)}
.move .acts .pri{background:var(--acc);color:#fff}
.bar{display:flex;gap:10px;border-top:1px solid rgba(99,102,241,.3);padding-top:12px}
.bar button{min-height:52px;border-radius:var(--r);font-weight:600;font-size:.95rem;border:1.5px solid var(--bd);background:var(--surf)}
#btn-list{flex:0 0 36%;color:#a5b4fc}
#btn-sync{flex:1;background:var(--acc);border:0;color:#fff;box-shadow:0 4px 18px rgba(99,102,241,.4)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}.dot.pend{background:var(--warn)}

/* ── Marcadores ── */
.al{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2.5px solid;background:rgba(10,14,26,.9)}
.al span{transform:rotate(45deg);font-size:16px}
.al.sel{box-shadow:0 0 0 4px rgba(255,255,255,.35)}.al.off{opacity:.4;filter:grayscale(1)}
.pl{background:var(--surf);border:2px solid var(--ok);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.tip{background:var(--surf)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;font:600 .75rem var(--font)!important}

/* ── Controles de Leaflet: suben sobre el dock para no taparse con la barra inferior ── */
.leaflet-bottom{bottom:calc(var(--dockh) + 8px)!important}
.leaflet-left .leaflet-control{margin-left:12px!important}
.leaflet-control-zoom{border:1.5px solid var(--bd)!important;border-radius:var(--r)!important;background:var(--glass)!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a{background:transparent!important;color:var(--tx)!important;border:0!important;width:44px!important;height:44px!important;line-height:44px!important;font-size:22px!important}
.leaflet-control-zoom a.leaflet-control-zoom-in{border-bottom:1px solid var(--bd)!important}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--tx2)!important;border-radius:8px;padding:2px 8px!important;font-size:11px!important}
.leaflet-control-attribution a{color:#a5b4fc!important}

/* ── Confirmación y aviso ── */
.modal{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px}
.modal>div{background:var(--surf);border:1.5px solid var(--bd);border-radius:var(--r);padding:18px;max-width:340px;width:100%}
.modal p{margin-bottom:14px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(var(--dockh) + 80px);transform:translateX(-50%);z-index:800;background:var(--surf);border:1px solid var(--bd);border-radius:99px;padding:10px 18px;font-size:.85rem;max-width:86%;text-align:center}
@media (prefers-reduced-motion:no-preference){.fab,.chip,.bar button{transition:transform .12s}.fab:active,.bar button:active{transform:scale(.96)}}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<!-- Iconos (estilo Lucide). Se usan con <svg class="ic"><use href="#i-nombre"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-pie" viewBox="0 0 24 24"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></symbol>
  <symbol id="i-pos" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M22 12h-4"/><path d="M6 12H2"/><path d="M12 6V2"/><path d="M12 22v-4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 2v20"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="m5 9-3 3 3 3"/><path d="m9 5 3-3 3 3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</svg>

<div id="map" aria-label="Mapa del campus"></div>

<header class="top" id="top">
  <div class="head">
    <button class="back" id="btn-back" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button>
    <div class="ttl">
      <h1>Editor de mapa y <b>alertas</b></h1>
      <p>Agrega, mueve y gestiona alertas sobre el mapa.</p>
    </div>
    <div class="chip ok" id="chip" role="status" aria-live="polite"><svg class="ic"><use href="#i-ok"/></svg><span>Todo sincronizado</span></div>
  </div>
  <div class="filters">
    <details class="layers" open>
      <summary><svg class="ic"><use href="#i-layers"/></svg><span>Capas</span><svg class="ic chev"><use href="#i-chev"/></svg></summary>
      <label><input type="checkbox" data-layer="alertas" checked> Alertas</label>
      <label><input type="checkbox" data-layer="lugares" checked> Lugares</label>
      <label><input type="checkbox" data-layer="cobertura"> Cobertura de fotos</label>
      <label><input type="checkbox" data-layer="rutas"> Rutas</label>
    </details>
    <div class="flt" id="w-tipo">
      <div class="lbl"><svg class="ic"><use href="#i-tag"/></svg>Tipo</div>
      <div class="val"><span id="v-tipo">Todos</span><svg class="ic"><use href="#i-chev"/></svg></div>
      <select id="f-tipo" aria-label="Filtrar por tipo"><option value="">Todos</option><option value="agua">Agua</option><option value="mobiliario">Mobiliario</option><option value="escalones">Escalones</option><option value="obra">Obra</option><option value="vehiculos">Vehículos</option><option value="otro">Otro</option></select>
    </div>
    <div class="flt" id="w-prio">
      <div class="lbl"><svg class="ic"><use href="#i-alert"/></svg>Prioridad</div>
      <div class="val"><span id="v-prio">Todas</span><svg class="ic"><use href="#i-chev"/></svg></div>
      <select id="f-prio" aria-label="Filtrar por prioridad"><option value="">Todas</option><option value="alta">Alta</option><option value="normal">Normal</option></select>
    </div>
    <div class="flt" id="w-estado">
      <div class="lbl"><svg class="ic"><use href="#i-pie"/></svg>Estado</div>
      <div class="val"><span id="v-estado">Todos</span><svg class="ic"><use href="#i-chev"/></svg></div>
      <select id="f-estado" aria-label="Filtrar por estado"><option value="">Todos</option><option value="activa">Activa</option><option value="inactiva">Inactiva</option></select>
    </div>
  </div>
</header>

<div class="side">
  <button class="fab" id="btn-pos"><svg class="ic"><use href="#i-pos"/></svg>Mi posición</button>
  <button class="fab" id="btn-lista-top"><svg class="ic"><use href="#i-list"/></svg>Ver lista</button>
</div>
<button id="btn-new"><svg class="ic"><use href="#i-plus"/></svg>Nueva alerta</button>

<footer class="dock" id="dock">
  <div class="move hidden" id="move-bar"><p>Arrastra el marcador al nuevo punto.</p><div class="acts"><button class="pri" id="move-ok">Listo</button><button id="move-cancel">Cancelar</button></div></div>
  <div class="card hidden" id="card" role="region" aria-live="polite"></div>
  <div class="bar">
    <button id="btn-list"><svg class="ic"><use href="#i-list"/></svg>Ver lista</button>
    <button id="btn-sync"><svg class="ic"><use href="#i-cloud"/></svg><span>Guardar / Sincronizar</span><i class="dot" id="dot"></i></button>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="mapa_base.js"></script>
<script src="editor_mapa.js"></script>
</body>
</html>
