<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Calibración: tramo A → B</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; background: #0A0E1A; }
    /* Salvavidas por si MapaBase.iniciar espera estos ids (como en recoleccion_mapa.html). */
    #top, #dock, #btn-back { display: none; }

    .pin {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font: 700 16px/1 system-ui, sans-serif;
      border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .55);
    }
    .pin-a { background: #2EE887; color: #04210F; }
    .pin-b { background: #8B6BFF; color: #fff; }
    #map.bloqueado { opacity: .92; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="dock"></div>
  <button id="btn-back" type="button"></button>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="mapa_base.js"></script>
  <script src="calibracion_mapa.js"></script>
</body>
</html>
