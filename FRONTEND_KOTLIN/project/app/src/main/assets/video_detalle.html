<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Detalle de video</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--surf:#111827;--glass:rgba(17,24,39,.88);--acc:#6366f1;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--info:#3b82f6;
--tx:#f1f5f9;--tx2:#94a3b8;--bd:rgba(99,102,241,.45);--r:14px;--font:'Inter',-apple-system,sans-serif;
/* Los fija el JS: insets del sistema (los manda Kotlin) y alto real de cabecera y dock */
--sat:0px;--sab:0px;--toph:120px;--dockh:140px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font)}
#map{position:absolute;inset:0;z-index:1}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Cabecera ── */
.top{position:fixed;top:0;left:0;right:0;z-index:500;padding:calc(var(--sat) + 8px) 12px 8px;pointer-events:none}
.top::before{content:'';position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 130px);background:linear-gradient(rgba(10,14,26,.96) 60%,transparent);z-index:-1;pointer-events:none}
.head{display:flex;align-items:flex-start;gap:8px}
.back{width:44px;min-width:44px;height:48px;margin-left:-8px;background:none;border:0;color:var(--acc);pointer-events:auto}
.back .ic{width:28px;height:28px}
.ttl{flex:1;min-width:0;padding-top:3px}
.ttl h1{font-size:1.05rem;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{font-size:.78rem;color:var(--tx2);margin-top:3px;line-height:1.3}
.sw{display:inline-flex;align-items:center;gap:10px;margin-top:6px;min-height:44px;padding:0 14px;background:var(--glass);border:1.5px solid var(--bd);
  border-radius:var(--r);backdrop-filter:blur(8px);font-size:.82rem;font-weight:500;pointer-events:auto}
.sw input{width:20px;height:20px;accent-color:var(--acc)}

/* ── Dock: vista previa, tira de fotos y barra inferior ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:500;padding:10px 12px calc(12px + var(--sab));
  background:linear-gradient(transparent,rgba(10,14,26,.95) 30px);pointer-events:none}
.dock>*{pointer-events:auto}
.card{background:var(--glass);backdrop-filter:blur(10px);border:1.5px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:10px;position:relative}
.c-head{display:flex;gap:12px;align-items:flex-start;padding-right:36px}
.c-img{flex:none;width:96px;height:72px;object-fit:cover;border-radius:10px;background:var(--surf)}
.card h2{font-size:1rem;font-weight:600}
.meta{font-size:.78rem;color:var(--tx2);display:flex;flex-direction:column;gap:6px;margin-top:6px}
.meta div{display:flex;gap:8px;align-items:center;line-height:1.3}
.meta .ic{width:16px;height:16px;color:var(--acc)}
.card .x{position:absolute;top:2px;right:2px;width:44px;height:44px;background:none;border:0;color:var(--tx2)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;background:var(--surf);border:1.5px solid var(--info);color:var(--info);border-radius:10px;font-size:.85rem;font-weight:500}
.acts .del{border-color:var(--bad);color:var(--bad)}
.acts .pri{background:var(--acc);border-color:var(--acc);color:#fff}
.acts button:disabled{opacity:.4}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.strip:empty{display:none}
.strip button{flex:none;position:relative;width:64px;height:64px;min-height:64px;padding:0;overflow:hidden;background:var(--surf);
  border:2px solid transparent;border-radius:10px;scroll-snap-align:center}
.strip button.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(99,102,241,.35)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip span{position:absolute;left:3px;bottom:3px;min-width:20px;padding:0 5px;border-radius:99px;background:rgba(10,14,26,.85);font-size:.68rem;font-weight:600;line-height:20px;text-align:center}
.bar{display:flex;gap:10px;border-top:1px solid rgba(99,102,241,.3);padding-top:12px}
.bar button{min-height:52px;border-radius:var(--r);font-weight:600;font-size:.95rem;border:1.5px solid var(--bd);background:var(--surf)}
#btn-ren{flex:1;color:#a5b4fc}
/* "Eliminar video" va separado y en rojo para evitar toques accidentales */
#btn-del{flex:0 0 42%;margin-left:14px;border-color:var(--bad);color:var(--bad)}

/* ── Marcadores: círculo numerado + flecha de orientación (0° = norte, sentido horario) ── */
.ph{position:relative;width:44px;height:44px}
.ph .arr{position:absolute;inset:0;width:44px;height:44px;fill:var(--acc)}
.ph span{position:absolute;inset:9px;border-radius:50%;background:var(--surf);border:2px solid var(--acc);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--tx)}
.ph.sel span{background:var(--acc);color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35)}

/* ── Controles de Leaflet: suben sobre el dock para no taparse con la barra inferior ── */
.leaflet-bottom{bottom:calc(var(--dockh) + 8px)!important}
.leaflet-left .leaflet-control{margin-left:12px!important}
.leaflet-control-zoom{border:1.5px solid var(--bd)!important;border-radius:var(--r)!important;background:var(--glass)!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a{background:transparent!important;color:var(--tx)!important;border:0!important;width:44px!important;height:44px!important;line-height:44px!important;font-size:22px!important}
.leaflet-control-zoom a.leaflet-control-zoom-in{border-bottom:1px solid var(--bd)!important}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--tx2)!important;border-radius:8px;padding:2px 8px!important;font-size:11px!important}
.leaflet-control-attribution a{color:#a5b4fc!important}

/* ── Diálogos y aviso ── */
.modal{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px}
.modal>div{background:var(--surf);border:1.5px solid var(--bd);border-radius:var(--r);padding:18px;max-width:360px;width:100%}
.modal .tx{margin-bottom:14px;line-height:1.4;white-space:pre-line}
.modal input[type=text]{width:100%;min-height:48px;margin-bottom:14px;padding:0 12px;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(var(--dockh) + 80px);transform:translateX(-50%);z-index:800;background:var(--surf);border:1px solid var(--bd);border-radius:99px;padding:10px 18px;font-size:.85rem;max-width:86%;text-align:center}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<!-- Iconos (estilo Lucide). Se usan con <svg class="ic"><use href="#i-nombre"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
</svg>

<div id="map" aria-label="Mapa con las fotos del video"></div>

<header class="top" id="top">
  <div class="head">
    <button class="back" id="btn-back" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button>
    <div class="ttl">
      <h1 id="t-nombre">Video</h1>
      <p id="t-meta"></p>
    </div>
  </div>
  <label class="sw"><input type="checkbox" id="chk-otros"> Mostrar otros videos</label>
</header>

<footer class="dock" id="dock">
  <div class="card hidden" id="card" role="region" aria-live="polite"></div>
  <div class="strip" id="strip" aria-label="Fotos del video"></div>
  <div class="bar">
    <button id="btn-ren"><svg class="ic"><use href="#i-edit"/></svg>Renombrar</button>
    <button id="btn-del"><svg class="ic"><use href="#i-trash"/></svg>Eliminar video</button>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="mapa_base.js"></script>
<script src="video_detalle.js"></script>
</body>
</html>
